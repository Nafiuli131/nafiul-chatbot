server:
  port: 8080

groq:
  api-key: ${GROQ_API_KEY}
  base-url: https://api.groq.com/openai/v1
  model: llama-3.3-70b-versatile
  temperature: 0.7
  max-tokens: 1024

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:groqchat}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:ThisIsASecretKeyForGroqChatAppMustBe32CharsMin!!}
  expiration: 86400000  # 24 hours in ms

# RAG Configuration
rag:
  docs-path: classpath:docs/
  vector-store-path: ./data/vector-store.json
  chunk-size: 800
  chunk-overlap: 200
